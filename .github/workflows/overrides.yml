on:
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - flake.lock
      - generated/*
  pull_request:
    paths:
      - "**.nix"
      - flake.lock
      - generated/*
name: "Plugin Overrides"

jobs:
  build-matrix:
    name: build changed overrides matrix
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.list.outputs.dirs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need history for the diff

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Resolve base ref
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            # New branch / force-push / first push: `before` is all zeros.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              base="origin/${{ github.event.repository.default_branch }}"
            else
              base="$before"
            fi
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"

      - name: List changed override directories
        id: list
        run: |
          set -euo pipefail
          
          allOverrides=$(find overrides/ -name "default.nix" \
            | awk -F/ 'NF>=3 {print $2}' \
            | jq -R . | jq -sc .)
          echo "All overrides: $allOverrides"
          
          changedOverrides=$(git diff --name-only "$BASE"...HEAD -- overrides/ \
            | awk -F/ 'NF>=3 {print $2}' \
            | jq -R . | jq -cs .)
          echo "Changed overrides: $changedOverrides"
          
          updatedPlugins=$(nix run '.#_nix-jebrains-plugins-generator' -- \
            --output-path ./generated diff --names-json "$BASE" HEAD)
          echo "Updated plugins: $updatedPlugins"
          
          allChanges=$(echo "$changedOverrides"$'\n'"$updatedPlugins" | jq -cs 'add' | jq -c '. |= unique')
          echo "$allChanges"$'\n'"$allOverrides" > /tmp/test
          allChangesFiltered=$(echo "$allChanges"$'\n'"$allOverrides" | jq -cs '.[0] - (.[0] - .[1])')
          echo "dirs=$allChangesFiltered" >> "$GITHUB_OUTPUT"
          echo "Override to check: $allChangesFiltered"

  build:
    needs: build-matrix
    if: needs.build-matrix.outputs.dirs != '[]'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.build-matrix.outputs.dirs) }}
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build '${{ matrix.dir }}'
        env:
          MATRIX_DIR: ${{ matrix.dir }}
        run: |
          nix build --impure --expr '
            let
             dir = builtins.getEnv "MATRIX_DIR";
            in
            ((builtins.getFlake (toString ./.)).lib.pluginsForIde (import <nixpkgs> {}) "idea" [dir]).${dir}
          '
