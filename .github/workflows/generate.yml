name: Generate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 6"

jobs:
  generate:
    name: Generate plugin list
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run generator
        run: |
          nix run '.#_nix-jebrains-plugins-generator' -- --output-path ./generated generate
          nix run '.#_nix-jebrains-plugins-generator' -- --output-path ./generated cleanup
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: .
          title: Plugin Updates
          body: Autogenerated by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit-message: Plugin Updates
          branch: plugin-updates
          delete-branch: true
          push-to-fork: nix-jetbrains-updater/nix-jetbrains-plugins
          # we use a custom token to trigger actions on the PR
          # see: https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#triggering-further-workflow-runs
          # token user: nix-jetbrains-updater
          token: "${{ secrets.PR_TOKEN   }}"
