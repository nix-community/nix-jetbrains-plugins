on:
  push:
    branches:
      - main
    paths:
      - "**.nix"
      - flake.lock
      - .github/workflows/nix-lint.yml
  pull_request:
    paths:
      - "**.nix"
      - flake.lock
      - .github/workflows/nix-lint.yml
name: "Nix: Formatting"

jobs:
  nix-fmt:
    name: nix fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check formatting
        run: nix fmt -- --ci
