[package]
name = "nix-jebrains-plugins-generator"
version = "0.5.0"
edition = "2024"

[features]
default = ["diff"]
diff = ["dep:gix", "dep:pathdiff", "dep:ansi_term"]

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros"] }
tokio-stream = { version = "0.1", features = ["fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "query", "native-tls"] }
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
log4rs = "1.4"
serde = "1"
serde-xml-rs = "0.8"
serde_json = "1"
futures = "0.3"
tokio-retry2 = "0.9"
nix-base32 = "0.2"
base64 = "0.22"
version-compare = "0.2"
lazy_static = "1.5"
which = "8"
gix = { version = "0.85", optional = true, default-features = false, features = ["basic", "sha1", "blocking-http-transport-reqwest"] }
pathdiff = { version = "0.2", optional = true }
ansi_term = { version = "0.12", optional = true }
